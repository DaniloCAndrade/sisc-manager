# ============================================================
# .gitlab-ci.yml — front-sisc
#
# Deploys the "sisc-manager-frontend" image. This repo cannot use the plain
# 2-line `include: ci-templates/build-and-deploy.yml` (SERVICE_NAME
# convention), because SISC Manager's gitops-config path (apps/sisc-manager)
# is shared across the frontend and all 5 back-end-sisc microservices — the
# image name (sisc-manager-frontend) and the gitops path (apps/sisc-manager)
# are no longer the same string. This file mirrors the shared template's
# stages, tagging scheme and promotion rules 1:1, just parameterized for
# that split.
#
# Requires the same group CI/CD variables as the shared template:
# HARBOR_REGISTRY, HARBOR_ROBOT_USERNAME, HARBOR_ROBOT_SECRET,
# GITOPS_REPO, GITOPS_REPO_SSH_KEY, GITLAB_HOST.
# ============================================================

variables:
  HARBOR_PROJECT: corp
  IMAGE_NAME: sisc-manager-frontend
  GITOPS_APP_PATH: apps/sisc-manager

stages:
  - build
  - deploy-qa
  - deploy-staging
  - deploy-prod

# ============================================================
#  BUILD — Build image, push to Harbor
# ============================================================

build-and-push:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="sha-${CI_COMMIT_SHORT_SHA}"
      fi
      IMAGE_FULL="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${IMAGE_TAG}"
      echo "IMAGE_TAG=${IMAGE_TAG}"   >> build.env
      echo "IMAGE_FULL=${IMAGE_FULL}" >> build.env
      echo "Building ${IMAGE_FULL}"
  script:
    # No VITE_API_* build-args on purpose: the image must be identical
    # across qa/staging/prod (see src/config.ts) so it can be promoted
    # unchanged instead of rebuilt per environment.
    - docker build -t "${IMAGE_FULL}" .
    - docker login -u "${HARBOR_ROBOT_USERNAME}" -p "${HARBOR_ROBOT_SECRET}" "${HARBOR_REGISTRY}"
    - docker push "${IMAGE_FULL}"
  artifacts:
    reports:
      dotenv: build.env

# ============================================================
#  DEPLOY — update apps/sisc-manager/overlays/<env>/kustomization.yaml
# ============================================================

.deploy:
  image: alpine:3.20
  needs:
    - job: build-and-push
      artifacts: true
  before_script:
    - apk add --no-cache git openssh-client kustomize
    - eval $(ssh-agent -s)
    - chmod 600 "${GITOPS_REPO_SSH_KEY}"
    - ssh-add "${GITOPS_REPO_SSH_KEY}"
    - mkdir -p ~/.ssh && ssh-keyscan "${GITLAB_HOST}" >> ~/.ssh/known_hosts
  script:
    - |
      git clone -b "${GITOPS_BRANCH:-main}" "${GITOPS_REPO}" gitops-config
      cd "gitops-config/${GITOPS_APP_PATH}/overlays/${DEPLOY_ENV}"
      kustomize edit set image \
        "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}=${IMAGE_FULL}"
      cd "${CI_PROJECT_DIR}/gitops-config"
      git config user.name "gitlab-ci[bot]"
      git config user.email "gitlab-ci[bot]@noreply.${GITLAB_HOST}"
      git add -A
      git diff --cached --quiet && echo "No changes" && exit 0
      git commit -m "deploy(${IMAGE_NAME}): ${DEPLOY_ENV} → ${IMAGE_TAG}"
      git push

deploy-qa:
  extends: .deploy
  stage: deploy-qa
  environment:
    name: qa
  variables:
    DEPLOY_ENV: qa
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-staging:
  extends: .deploy
  stage: deploy-staging
  environment:
    name: staging
  variables:
    DEPLOY_ENV: staging
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

deploy-prod:
  extends: .deploy
  stage: deploy-prod
  needs:
    - job: deploy-staging
    - job: build-and-push
      artifacts: true
  environment:
    name: production
  variables:
    DEPLOY_ENV: prod
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: false
